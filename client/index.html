<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chat con NodeJS y SocketIO</title>
		<link rel="stylesheet" href="styles.css">
		<script src="/socket.io/socket.io.js" defer></script>
		<script src="main.js" defer></script>
	</head>
	<body>
		<h1>Chat con NodeJS y SocketIO</h1>
		<div id="messages" role="log" aria-live="polite" tabindex="0"></div>
		<form id="chat-form">
			<input id="nickname" maxlength="30" placeholder="Nickname (opcional)" aria-label="Nickname" autocomplete="nickname">
			<textarea id="text" maxlength="500" rows="3" placeholder="Mensaje... (Shift+Enter para otra línea)" aria-label="Mensaje" required></textarea>
			<p id="status" role="status"></p>
			<button>Enviar</button>
		</form>
	</body>
</html>
